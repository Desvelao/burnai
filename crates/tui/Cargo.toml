[package]
name = "plan-burner-tui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tui"
path = "src/main.rs"

[dependencies]
plan-burner-core = { path = "../core" }
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
